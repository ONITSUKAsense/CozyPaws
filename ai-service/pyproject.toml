[project]
name = "cozypaws-ai"
version = "0.1.0"
description = "AI shopping assistant for CozyPaws pet store (RAG / Agent / Memory)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.138",
    "uvicorn[standard]>=0.49",
    "pydantic>=2.13",
    "pydantic-settings>=2.14",
    "langchain>=1.0,<2",
    "langchain-openai>=0.3",
    "langchain-huggingface",
    "langchain-chroma>=0.1",
    "chromadb~=1.5",
    "langgraph>=1.2",
    "langgraph-checkpoint-sqlite>=2.0",
    "langsmith>=0.8",
    "ragas>=0.4",
    "sentence-transformers",
    "pymysql",
    "cryptography",
    "requests",
    "python-dotenv",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
