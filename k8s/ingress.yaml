apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cozypaws-ingress
  namespace: cozypaws
  annotations:
    # SSE 流式响应：关闭 nginx ingress 代理缓冲
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-http-version: "1.1"
spec:
  rules:
    - host: cozypaws.example.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: cozypaws-backend
                port: { number: 8080 }
          - path: /ai
            pathType: Prefix
            backend:
              service:
                name: cozypaws-ai
                port: { number: 8000 }
